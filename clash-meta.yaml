external-controller: 127.0.0.1:49997
# 本仓库为公开参考版，已移除真实 secret。本机使用时需在本地 config.yaml 里填入实际值，不要提交到 git。
# secret: <填入本机的 external-controller 密钥，不要提交到 git>
port: 7890
socks-port: 7891
redir-port: 7892
allow-lan: false
mode: rule
log-level: warning
ipv6: false
dns:
  enable: true
  use-hosts: true
  # 用纯 IP 解析 DoH 服务器自身的域名，否则出现死循环：
  # 解析境外域名要访问 DoH -> 访问 DoH 要先解析它的域名 -> 又走 fallback
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 10.21.10.1
    - 10.1.3.1
    - 119.29.29.29
    - 223.5.5.5
  # 公司内网域名只能由内网 DNS 解析，公网 DNS 会返回 NXDOMAIN。
  # nameserver 是并发竞速取最快结果，公网 DNS 的 NXDOMAIN 常先到并被缓存，
  # 导致纯内网域名（如 gaia-geo 这类）间歇性解析失败（ERR_CONNECTION_CLOSED）。
  # 这里强制内网域名只问内网 DNS，绕开竞速。
  nameserver-policy:
    '+.gaiaworks.cn':
      - 10.1.3.1
      - 10.21.10.1
    '+.gaiaworks.net':
      - 10.1.3.1
      - 10.21.10.1
  # 境外域名抗污染：nameserver 返回的国内 IP 直接采用；
  # 若结果不在 CN（fallback-filter 判定），则改用下面的境外 DoH 结果。
  # 实测国内 DNS 会把 chatgpt.com 污染成 Facebook IP、gemini.google.com 污染成香港小厂 IP。
  # #Fast 后缀让 DNS 查询本身走代理组发出。
  # 本机直连境外 DoH 不通（实测 1.1.1.1 直连超时、经代理 0.57s），
  # 不加这个后缀 fallback 会全部超时，境外域名反而一个都解析不出来。
  fallback:
    - 'https://1.1.1.1/dns-query#Fast'
  # 节点自身域名（如机场的 xxx.plebai.net）必须用国内 DNS 直连解析。
  # 否则死循环：连节点要先解析它的域名 -> 解析走 fallback -> fallback 又要先连节点
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
proxy-providers:
  autoGhelper:
    type: http
    # 本仓库为公开参考版，已移除真实机场订阅链接（含 token）。
    # 本机使用时需在本地 config.yaml 里填入机场提供的实际订阅地址，不要提交到 git。
    url: "<填入机场的 Clash Meta 订阅链接，不要提交到 git>"
    path: ./autoGhelper.yaml
    interval: 172800 # 48小时
    health-check:
      enable: true
      interval: 3600
      lazy: true
      url: http://www.gstatic.com/generate_204
proxy-groups:
  - name: Fast
    type: url-test
    # 只让多轮实测表现较好的四个节点参与竞速（与手机端保持一致）。
    # 使用精确名称白名单，避免再次选中延迟正常但实际访问不稳定的节点。
    filter: "^(🇭🇰 香港05|🇭🇰香港04|🇯🇵 日本5|🇸🇬 新加坡\\[CM\\])$"
    use:
      - autoGhelper
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
  - name: AI
    type: url-test
    filter: "日本|新加坡"
    use:
      - autoGhelper
    url: http://www.gstatic.com/generate_204
    interval: 21600
    tolerance: 100
    timeout: 5000
  - name: 美国
    type: url-test
    # 排除两个实测有问题的节点：美国洛杉矶[CM]（服务器 TCP 可达但代理转发完全失败，
    # mihomo 延迟测试直接报错）、美国洛杉矶2（TLS 握手失败，仅明文 HTTP 可通）。
    # 改用精确白名单：12 个节点均经三源交叉验证（Cloudflare trace / ipinfo / ip-api）确认落地美国。
    # Muse 等美国独占服务专用。与 AI 组同为 21600 秒，避免出口 IP 抖动导致
    # Meta 账号风控/会话失效（Muse 是长任务代理，换 IP 代价比慢几十毫秒高）
    filter: "^(美国西雅图|美国西雅图2|美国硅谷|美国硅谷2|美国硅谷3|美国硅谷4|美国硅谷5|美国硅谷6|美国洛杉矶|美国洛杉矶3|美国圣何塞|美国ISP)$"
    use:
      - autoGhelper
    url: http://www.gstatic.com/generate_204
    interval: 21600
    tolerance: 100
    timeout: 5000
  - name: 香港智能
    type: url-test
    filter: "香港"
    use:
      - autoGhelper
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
  - name: PROXY
    type: select
    proxies:
      - Fast
      - AI
      - 美国
      - 香港智能
      - DIRECT
