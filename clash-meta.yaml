rules:
  # 本地和管理相关
  - RULE-SET,lancidr,DIRECT
  - RULE-SET,private,DIRECT
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  - DOMAIN,integrate.api.nvidia.com,DIRECT
  - DOMAIN,api.smith.langchain.com,DIRECT
  # 公司内网直连
  - DOMAIN-SUFFIX,gaiaworks.cn,DIRECT
  - DOMAIN-SUFFIX,gaia34learning.com,DIRECT
  - DOMAIN,localhost,DIRECT
  - DOMAIN,gaiaworks.cn,DIRECT
  - DOMAIN,gaia34learning.com,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,10.23.0.0/16,DIRECT
  # 公司自建AI中转域名，走直连（优先级高于ai-global，避免被规则集覆盖到代理）
  - DOMAIN-SUFFIX,coding.gaiaworks.net,DIRECT
  # 自定义线路
  - DOMAIN,translate.googleapis.com,Fast
  - DOMAIN-SUFFIX,zaobao.com,香港智能
  - DOMAIN-SUFFIX,zaobao.com.sg,香港智能
  # Meta Muse（美国独占：仅限美国 18+，iOS/Android/Web/WhatsApp，Muse Spark 驱动）
  # 必须置于 ai-global 之前：该规则集含 DOMAIN-SUFFIX,meta.ai，否则会被捞去 AI 组（日本/新加坡）
  - DOMAIN-SUFFIX,muse.ai,美国
  - DOMAIN-SUFFIX,meta.ai,美国
  # Muse 用 Meta 账号（Facebook/Instagram）登录，登录链路必须与页面同出口。
  # 实测 2026-09-20 09:27 那次登录：muse.ai 走香港的同时，auth.meta.com /
  # www.facebook.com / www.instagram.com 被 RULE-SET,proxy 捞去香港，
  # 等于向 Meta 暴露跨区访问。故一并锁美国。
  # 副作用：平时刷 Facebook / Instagram 也走美国，比香港慢（美国最快 193ms）。
  - DOMAIN-SUFFIX,meta.com,美国
  - DOMAIN-SUFFIX,facebook.com,美国
  # facebook.net 与 facebook.com 是不同顶级域，实测 connect.facebook.net
  # （Meta 登录 SDK）会漏给 RULE-SET,proxy，必须单列
  - DOMAIN-SUFFIX,facebook.net,美国
  - DOMAIN-SUFFIX,fbcdn.net,美国
  - DOMAIN-SUFFIX,instagram.com,美国
  # AI 服务专用：日本/新加坡
  - RULE-SET,ai-global,AI
  # Google 全量走 AI 综合线路
  - GEOSITE,google,AI
  # 服务商相关域名直连
  - DOMAIN-SUFFIX,p5pv.com,DIRECT
  - DOMAIN-SUFFIX,z7zi.com,DIRECT
  - DOMAIN-SUFFIX,j2ai.com,DIRECT
  - DOMAIN-SUFFIX,plebai.net,DIRECT
  - DOMAIN-SUFFIX,gotochinatown.net,DIRECT
  - DOMAIN-SUFFIX,tcpbbr.net,DIRECT
  # 广告拦截
  - RULE-SET,reject,REJECT
  # 应用程序直连
  - RULE-SET,applications,DIRECT
  # 国内服务直连
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,direct,DIRECT
  - RULE-SET,cncidr,DIRECT
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  # 需要代理的服务
  - RULE-SET,google,AI
  - RULE-SET,proxy,PROXY
  - RULE-SET,gfw,PROXY
  - RULE-SET,greatfire,PROXY
  - RULE-SET,tld-not-cn,PROXY
  - RULE-SET,telegramcidr,PROXY
  # 兜底规则：内网IP直连，其他走代理
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - MATCH,PROXY
