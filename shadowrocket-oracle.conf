DOMAIN-SUFFIX,youtube.com,Fast
DOMAIN-SUFFIX,youtu.be,Fast
DOMAIN-SUFFIX,ytimg.com,Fast
DOMAIN-SUFFIX,googlevideo.com,Fast
DOMAIN-SUFFIX,ggpht.com,Fast
DOMAIN-SUFFIX,youtube-nocookie.com,Fast
DOMAIN-SUFFIX,youtubekids.com,Fast
