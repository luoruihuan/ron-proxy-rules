[Host]
localhost = 127.0.0.1
# 公司内网域名指定内网 DNS，与桌面 clash-meta.yaml 的 nameserver-policy 同源：
# 公网 DNS 会把 gaiaworks.cn 解析到公网入口 IP（GitLab 等服务在内网入口才可达），
# 纯内网域名（gaia-geo 等）公网 DNS 直接 NXDOMAIN。
# 10.1.3.1 为首选：实测 10.21.10.1 解析 gaiaworks.net / gaia34learning.com 会超时。
# 外网环境下 10.1.3.1 不可达，这些域名解析可能超时/失败——外网本就访问不了内网服务，可接受。
gaiaworks.cn = server:10.1.3.1
*.gaiaworks.cn = server:10.1.3.1
gaiaworks.net = server:10.1.3.1
*.gaiaworks.net = server:10.1.3.1
gaia34learning.com = server:10.1.3.1
*.gaia34learning.com = server:10.1.3.1
