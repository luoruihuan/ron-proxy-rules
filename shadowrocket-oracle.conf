# YouTube 通过 Fast 使用首页选中的甲骨文节点
DOMAIN-SUFFIX,youtube.com,Fast
DOMAIN-SUFFIX,youtu.be,Fast
DOMAIN-SUFFIX,ytimg.com,Fast
DOMAIN-SUFFIX,googlevideo.com,Fast
DOMAIN-SUFFIX,ggpht.com,Fast
DOMAIN-SUFFIX,youtube-nocookie.com,Fast
DOMAIN-SUFFIX,youtubekids.com,Fast
DOMAIN-SUFFIX,youtubeeducation.com,Fast
DOMAIN-SUFFIX,youtubegaming.com,Fast

# ============ Meta Muse：锁定美国 ============
# 美国独占（仅限美国 18+，iOS/Android/muse.ai 网页版/WhatsApp，Muse Spark 驱动）。
# 必须置于下方 AI 规则集之前：该规则集含 DOMAIN-SUFFIX,meta.ai，否则会被捞去 AI 组
DOMAIN-SUFFIX,muse.ai,美国
DOMAIN-SUFFIX,meta.ai,美国
# Muse 用 Meta 账号（Facebook/Instagram）登录，登录链路必须与页面同出口。
# 桌面端实测：muse.ai 走美国的同时 auth.meta.com / facebook.com / instagram.com
# 会被后面的规则集捞去别的线路，等于向 Meta 暴露跨区访问。故一并锁美国。
# 副作用：平时刷 Facebook / Instagram 也走美国，比香港慢。
DOMAIN-SUFFIX,meta.com,美国
DOMAIN-SUFFIX,facebook.com,美国
# facebook.net 与 facebook.com 是不同顶级域，connect.facebook.net（登录 SDK）需单列
DOMAIN-SUFFIX,facebook.net,美国
DOMAIN-SUFFIX,fbcdn.net,美国
DOMAIN-SUFFIX,instagram.com,美国

# ============ AI 服务：甲骨文节点 ============
# 保留应用默认的 Apple Intelligence / Siri 中继与 Copilot 代理例外。
# 必须位于通用 Apple / Microsoft 直连规则之前；不能绕过设备或账号地区限制。
DOMAIN-SUFFIX,apple-relay.akamaized.net,AI
DOMAIN-SUFFIX,apple-relay.apple.com,AI
DOMAIN-SUFFIX,apple-relay.cloudflare.com,AI
DOMAIN-SUFFIX,apple-relay.fastly-edge.com,AI
DOMAIN-SUFFIX,apple-relay.mask.apple-dns.net,AI
DOMAIN,copilot.microsoft.com,AI
DOMAIN,copilot.bing.com,AI
# AI 核心域名本地保障，远程 AI 规则集不可用时仍明确走代理。
DOMAIN-SUFFIX,openai.com,AI
DOMAIN-SUFFIX,chatgpt.com,AI
DOMAIN-SUFFIX,oaistatic.com,AI
DOMAIN-SUFFIX,oaiusercontent.com,AI
DOMAIN-SUFFIX,anthropic.com,AI
DOMAIN-SUFFIX,claude.ai,AI
DOMAIN-SUFFIX,claude.com,AI
RULE-SET,https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/shadowrocket/global.list,AI
# Google 全量走 AI 综合线路（与桌面 GEOSITE,google 对齐）。
# YouTube 已在上方显式指向 Fast，且此规则集本身不含 youtube 域名，故不受影响。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Google/Google.list,AI

