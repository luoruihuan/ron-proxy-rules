# ============ Meta 系域名（与 AI 规则集的先后关系保留） ============
# 含 muse.ai / meta.ai 等；需置于下方 AI 规则集之前，便于集中管理与覆盖
DOMAIN-SUFFIX,muse.ai,Fast
DOMAIN-SUFFIX,meta.ai,Fast
# 候选节点均为美国出口（Oracle 美国机房），但 Fast 自动切换仍可能改变后续连接的出口 IP，
# 对地区/风控敏感的服务（Muse、Meta 账号）长会话期间注意出口变化。
DOMAIN-SUFFIX,meta.com,Fast
DOMAIN-SUFFIX,facebook.com,Fast
# facebook.net 与 facebook.com 是不同顶级域，connect.facebook.net（登录 SDK）需单列
DOMAIN-SUFFIX,facebook.net,Fast
DOMAIN-SUFFIX,fbcdn.net,Fast
DOMAIN-SUFFIX,instagram.com,Fast

# ============ AI 服务：走 Fast 自动择优 ============
# 保留应用默认的 Apple Intelligence / Siri 中继与 Copilot 代理例外。
# 必须位于通用 Apple / Microsoft 直连规则之前；不能绕过设备或账号地区限制。
DOMAIN-SUFFIX,apple-relay.akamaized.net,Fast
DOMAIN-SUFFIX,apple-relay.apple.com,Fast
DOMAIN-SUFFIX,apple-relay.cloudflare.com,Fast
DOMAIN-SUFFIX,apple-relay.fastly-edge.com,Fast
DOMAIN-SUFFIX,apple-relay.mask.apple-dns.net,Fast
DOMAIN,copilot.microsoft.com,Fast
DOMAIN,copilot.bing.com,Fast
# AI 核心域名本地保障，远程 AI 规则集不可用时仍明确走代理。
DOMAIN-SUFFIX,openai.com,Fast
DOMAIN-SUFFIX,chatgpt.com,Fast
DOMAIN-SUFFIX,oaistatic.com,Fast
DOMAIN-SUFFIX,oaiusercontent.com,Fast
DOMAIN-SUFFIX,anthropic.com,Fast
DOMAIN-SUFFIX,claude.ai,Fast
DOMAIN-SUFFIX,claude.com,Fast
RULE-SET,https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/shadowrocket/global.list,Fast
# Google 全量走 AI 综合线路（与桌面 GEOSITE,google 对齐）。
# YouTube 已在上方显式指向 Fast，且此规则集本身不含 youtube 域名，故不受影响。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Google/Google.list,Fast

